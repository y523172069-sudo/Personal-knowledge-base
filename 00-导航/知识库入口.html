<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人知识库入口</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #172033;
        --muted: #65728a;
        --line: #dce3ee;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --soft: #edf4ff;
        --warning: #fff7ed;
        --warning-line: #fed7aa;
        --shadow: 0 18px 45px rgba(31, 41, 55, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 32rem),
          var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", sans-serif;
        line-height: 1.6;
      }

      a {
        color: inherit;
      }

      .shell {
        width: min(1180px, calc(100% - 40px));
        margin: 0 auto;
        padding: 36px 0 56px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 20px;
        align-items: stretch;
        margin-bottom: 22px;
      }

      .hero-main,
      .side-card,
      .section {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(220, 227, 238, 0.9);
        border-radius: 24px;
        box-shadow: var(--shadow);
      }

      .hero-main {
        padding: 30px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--primary);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 10px;
        font-size: clamp(30px, 5vw, 46px);
        line-height: 1.08;
      }

      h2 {
        margin-bottom: 16px;
        font-size: 22px;
      }

      h3 {
        margin-bottom: 8px;
        font-size: 17px;
      }

      .muted {
        color: var(--muted);
      }

      .search-row {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      .search-row input {
        width: 100%;
        min-height: 48px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        color: var(--text);
        background: #fff;
        font: inherit;
        outline: none;
      }

      .search-row input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      }

      .side-card {
        padding: 22px;
      }

      .side-card code,
      .path {
        display: inline-block;
        max-width: 100%;
        padding: 3px 7px;
        overflow-wrap: anywhere;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
        color: #334155;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
      }

      .tip {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid var(--warning-line);
        border-radius: 14px;
        background: var(--warning);
        color: #9a3412;
        font-size: 14px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0 22px;
      }

      .filter {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        padding: 8px 14px;
      }

      .filter.active {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .section {
        padding: 24px;
        margin-top: 18px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .count {
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        display: flex;
        min-height: 190px;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
      }

      .card p {
        margin-bottom: 0;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }

      .tag {
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--soft);
        color: var(--primary-dark);
        font-size: 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .open,
      .copy {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 12px;
        border-radius: 10px;
        font: inherit;
        font-size: 14px;
        text-decoration: none;
      }

      .open {
        border: 1px solid var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .open:hover {
        background: var(--primary-dark);
      }

      .copy {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        cursor: pointer;
      }

      .empty {
        display: none;
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        transform: translateY(18px);
        opacity: 0;
        pointer-events: none;
        transition: 0.2s ease;
        padding: 12px 16px;
        border-radius: 14px;
        background: #111827;
        color: #fff;
        box-shadow: var(--shadow);
      }

      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }

      @media (max-width: 920px) {
        .hero,
        .grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 24px, 1180px);
          padding-top: 18px;
        }

        .hero-main,
        .side-card,
        .section {
          border-radius: 18px;
          padding: 18px;
        }

        .section-head {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="hero-main">
          <p class="eyebrow">Personal Knowledge Base</p>
          <h1>个人知识库入口</h1>
          <p class="muted">
            这是可点击的便捷导航页。Markdown 版知识库地图继续保持纯文本路径，用于规避
            Codex 点击链接闪退；本页用于日常跳转、搜索和复制路径。
          </p>
          <div class="search-row">
            <input id="search" type="search" placeholder="搜索文档、模块、案例、路径关键词…" autocomplete="off" />
          </div>
        </div>

        <aside class="side-card">
          <h2>稳定入口</h2>
          <p class="muted">如果点击打开仍受环境限制，复制路径后在 Codex 文件搜索或系统文件管理器中打开。</p>
          <p><code>00-导航/知识库地图.md</code></p>
          <div class="tip">保密提醒：本页只做导航，不放原始材料和敏感正文。</div>
        </aside>
      </header>

      <nav class="toolbar" aria-label="筛选导航">
        <button class="filter active" data-group="全部">全部</button>
        <button class="filter" data-group="快速入口">快速入口</button>
        <button class="filter" data-group="内容结构">内容结构</button>
        <button class="filter" data-group="当前重点案例">当前重点案例</button>
        <button class="filter" data-group="求职资产">求职资产</button>
      </nav>

      <main id="content"></main>
      <div id="empty" class="empty">没有匹配结果。可以换一个关键词，例如“能力”“Demo”“产品”“述职”。</div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite">已复制路径</div>

    <script>
      const entries = [
        {
          group: "快速入口",
          title: "知识库地图（安全版）",
          path: "00-导航/知识库地图.md",
          href: "知识库地图.md",
          desc: "纯文本路径索引，用于 Codex 兼容模式和稳定阅读。",
          tags: ["导航", "安全入口"],
        },
        {
          group: "快速入口",
          title: "知识库治理规则",
          path: "00-导航/知识库治理规则.md",
          href: "知识库治理规则.md",
          desc: "目录、命名、元数据、保密和结构变更的统一规则。",
          tags: ["治理", "规则"],
        },
        {
          group: "快速入口",
          title: "启动访谈",
          path: "07-访谈/00-启动访谈.md",
          href: "../07-访谈/00-启动访谈.md",
          desc: "个人背景、阶段状态和当前主线的访谈记录。",
          tags: ["访谈", "阶段"],
        },
        {
          group: "快速入口",
          title: "收集箱",
          path: "01-收集箱/README.md",
          href: "../01-收集箱/README.md",
          desc: "暂存未经整理的学习和工作信息。",
          tags: ["收集", "待整理"],
        },
        {
          group: "快速入口",
          title: "待整理清单",
          path: "01-收集箱/待整理清单.md",
          href: "../01-收集箱/待整理清单.md",
          desc: "尚未形成案例、证据或求职素材的内容。",
          tags: ["收集", "清单"],
        },
        {
          group: "快速入口",
          title: "能力地图",
          path: "04-能力证据/能力地图.md",
          href: "../04-能力证据/能力地图.md",
          desc: "跟踪能力、案例和证据缺口。",
          tags: ["能力", "证据"],
        },
        {
          group: "快速入口",
          title: "证据索引",
          path: "04-能力证据/证据索引.md",
          href: "../04-能力证据/证据索引.md",
          desc: "记录原始材料、可证明内容和公开限制。",
          tags: ["证据", "索引"],
        },
        {
          group: "求职资产",
          title: "简历素材池",
          path: "05-求职资产/简历素材池.md",
          href: "../05-求职资产/简历素材池.md",
          desc: "保存可量化、可验证的经历素材。",
          tags: ["简历", "素材"],
        },
        {
          group: "求职资产",
          title: "Demo 选题池",
          path: "05-求职资产/Demo选题池.md",
          href: "../05-求职资产/Demo选题池.md",
          desc: "把工作洞察转化为展示项目。",
          tags: ["Demo", "作品集"],
        },
        {
          group: "求职资产",
          title: "8月底简历与 Demo 交付计划",
          path: "05-求职资产/8月底简历与Demo交付计划.md",
          href: "../05-求职资产/8月底简历与Demo交付计划.md",
          desc: "轮岗结束前的简历、Demo 和述职材料验收计划。",
          tags: ["计划", "交付"],
        },
        {
          group: "求职资产",
          title: "定岗定位初稿",
          path: "05-求职资产/定岗定位初稿.md",
          href: "../05-求职资产/定岗定位初稿.md",
          desc: "当前岗位优先级与能力主线。",
          tags: ["定岗", "定位"],
        },
        {
          group: "求职资产",
          title: "定岗信息收集清单",
          path: "05-求职资产/定岗信息收集清单.md",
          href: "../05-求职资产/定岗信息收集清单.md",
          desc: "岗位公布后需要确认的信息。",
          tags: ["定岗", "清单"],
        },
        {
          group: "求职资产",
          title: "述职报告主线初稿",
          path: "05-求职资产/述职报告主线初稿.md",
          href: "../05-求职资产/述职报告主线初稿.md",
          desc: "用项目落地能力串联轮岗经历。",
          tags: ["述职", "报告"],
        },
        {
          group: "内容结构",
          title: "管培生学习",
          path: "02-管培生学习",
          href: "../02-管培生学习/",
          desc: "岗位理解、业务知识和工作方法。",
          tags: ["学习", "方法"],
        },
        {
          group: "内容结构",
          title: "实践复盘",
          path: "03-实践复盘/README.md",
          href: "../03-实践复盘/README.md",
          desc: "任务复盘、项目案例和轮岗总结。",
          tags: ["复盘", "项目"],
        },
        {
          group: "内容结构",
          title: "模板",
          path: "06-模板",
          href: "../06-模板/",
          desc: "学习笔记、工作复盘和项目案例模板。",
          tags: ["模板", "结构"],
        },
        {
          group: "内容结构",
          title: "个人知识库 HTML Demo",
          path: "08-Demo项目/个人知识库HTML/index.html",
          href: "../08-Demo项目/个人知识库HTML/index.html",
          desc: "展示知识库结构、能力证据和求职资产的交互页面。",
          tags: ["Demo", "展示"],
        },
        {
          group: "当前重点案例",
          title: "小联盟资质认证调研",
          path: "03-实践复盘/产品轮岗/小联盟资质认证调研.md",
          href: "../03-实践复盘/产品轮岗/小联盟资质认证调研.md",
          desc: "产品轮岗中的调研与需求判断案例。",
          tags: ["产品", "调研"],
        },
        {
          group: "当前重点案例",
          title: "产品经理如何识别真需求课题",
          path: "03-实践复盘/产品轮岗/产品经理如何识别真需求课题.md",
          href: "../03-实践复盘/产品轮岗/产品经理如何识别真需求课题.md",
          desc: "需求识别方法与产品判断案例。",
          tags: ["产品", "需求"],
        },
        {
          group: "当前重点案例",
          title: "Jira 产品优化需求",
          path: "03-实践复盘/产品轮岗/Jira产品优化需求.md",
          href: "../03-实践复盘/产品轮岗/Jira产品优化需求.md",
          desc: "需求池、工单和产品优化相关案例。",
          tags: ["Jira", "需求"],
        },
        {
          group: "当前重点案例",
          title: "AI 风控官内部使用调研",
          path: "03-实践复盘/产品轮岗/AI风控官内部使用调研.md",
          href: "../03-实践复盘/产品轮岗/AI风控官内部使用调研.md",
          desc: "AI 产品内部使用反馈与调研案例。",
          tags: ["AI", "调研"],
        },
        {
          group: "当前重点案例",
          title: "续费复购率课题——商学院云课堂",
          path: "03-实践复盘/销售轮岗/续费复购率课题-商学院云课堂.md",
          href: "../03-实践复盘/销售轮岗/续费复购率课题-商学院云课堂.md",
          desc: "销售轮岗中的续费复购分析案例。",
          tags: ["销售", "复购"],
        },
        {
          group: "当前重点案例",
          title: "会议部门 P1 材料归档与复盘",
          path: "03-实践复盘/会议轮岗/会议部门P1材料归档与复盘.md",
          href: "../03-实践复盘/会议轮岗/会议部门P1材料归档与复盘.md",
          desc: "会议轮岗材料归档、流程梳理与复盘。",
          tags: ["会议", "复盘"],
        },
      ];

      const groups = ["快速入口", "内容结构", "当前重点案例", "求职资产"];
      const content = document.querySelector("#content");
      const search = document.querySelector("#search");
      const empty = document.querySelector("#empty");
      const toast = document.querySelector("#toast");
      let activeGroup = "全部";

      function encodedHref(href) {
        return href
          .split("/")
          .map((part) => encodeURIComponent(part))
          .join("/");
      }

      function matchEntry(entry, keyword) {
        if (activeGroup !== "全部" && entry.group !== activeGroup) return false;
        if (!keyword) return true;
        const haystack = [
          entry.group,
          entry.title,
          entry.path,
          entry.desc,
          ...(entry.tags || []),
        ]
          .join(" ")
          .toLowerCase();
        return haystack.includes(keyword.toLowerCase());
      }

      function render() {
        const keyword = search.value.trim();
        const visible = entries.filter((entry) => matchEntry(entry, keyword));
        content.innerHTML = "";

        const renderGroups =
          activeGroup === "全部" ? groups : groups.filter((group) => group === activeGroup);

        for (const group of renderGroups) {
          const items = visible.filter((entry) => entry.group === group);
          if (!items.length) continue;

          const section = document.createElement("section");
          section.className = "section";
          section.innerHTML = `
            <div class="section-head">
              <h2>${group}</h2>
              <span class="count">${items.length} 项</span>
            </div>
            <div class="grid"></div>
          `;

          const grid = section.querySelector(".grid");
          for (const item of items) {
            const card = document.createElement("article");
            card.className = "card";
            card.innerHTML = `
              <div>
                <h3>${item.title}</h3>
                <p class="muted">${item.desc}</p>
                <div class="tags">${item.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}</div>
              </div>
              <div>
                <p class="path">${item.path}</p>
                <div class="actions">
                  <a class="open" href="${encodedHref(item.href)}" target="_blank" rel="noreferrer">打开</a>
                  <button class="copy" type="button" data-path="${item.path}">复制路径</button>
                </div>
              </div>
            `;
            grid.appendChild(card);
          }

          content.appendChild(section);
        }

        empty.style.display = visible.length ? "none" : "block";
      }

      async function copyPath(path) {
        try {
          await navigator.clipboard.writeText(path);
        } catch (error) {
          const helper = document.createElement("textarea");
          helper.value = path;
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          document.execCommand("copy");
          helper.remove();
        }

        toast.textContent = `已复制：${path}`;
        toast.classList.add("show");
        window.clearTimeout(window.__toastTimer);
        window.__toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1800);
      }

      document.addEventListener("click", (event) => {
        const filter = event.target.closest(".filter");
        if (filter) {
          activeGroup = filter.dataset.group;
          document.querySelectorAll(".filter").forEach((button) => button.classList.remove("active"));
          filter.classList.add("active");
          render();
          return;
        }

        const copy = event.target.closest(".copy");
        if (copy) {
          copyPath(copy.dataset.path);
        }
      });

      search.addEventListener("input", render);
      render();
    </script>
  </body>
</html>
